; PlayStation Trophy Display AMOLED
; Cible : Waveshare ESP32-S3-Touch-AMOLED-1.75 (466x466, CO5300/QSPI, CST9217/I2C, AXP2101, QMI8658, PCF85063)
;
; Choix de framework (voir docs/DEVELOPMENT.md pour la justification complete) :
;   PlatformIO + Arduino (arduino-esp32) + Arduino_GFX_Library + LVGL 9.4.x
; (migre depuis LVGL 8.3.11 le 2026-07-22 pour adopter le design final,
; ecrit nativement pour LVGL 9 -- voir HANDOFF_PROGRESS.md, branche
; integration/final-lvgl-ui, pour l'estimation de risque complete.)
; C'est exactement la combinaison utilisee par les exemples officiels Waveshare
; (waveshareteam/ESP32-S3-Touch-AMOLED-1.75, examples/arduino/06_LVGL_Widgets),
; ce qui maximise la fiabilite de compilation/flash par rapport a une config inventee.

[env:waveshare-amoled-175]
; NOTE DE COMPATIBILITE (verifiee par compilation reelle le 2026-07-13) :
; le snapshot framework-arduinoespressif32 livre par le registry PlatformIO
; pour espressif32@7.0.1 (3.20017.241212+sha.dcc1105b) ne contient pas
; cores/esp32/esp32-hal-periman.h, alors que GFX Library for Arduino >=1.6.2
; en depend inconditionnellement (databus/Arduino_ESP32SPI.h) des que la
; cible est un ESP32-Sx/Cx -- meme si on n'utilise que le bus QSPI. Forcer
; un framework arduino-esp32 3.x officiel via platform_packages echoue de
; son cote sur un desaccord de version de toolchain riscv32/xtensa avec ce
; qu'expose le registry PlatformIO pour cette plateforme. La combinaison
; qui compile reellement est donc : framework par defaut (7.0.1) + GFX
; Library for Arduino v1.6.1, la derniere version a la fois compatible
; CO5300 et sans dependance a esp32-hal-periman.h.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Memoire : Flash 16 Mo QIO + PSRAM 8 Mo Octal ---
; Confirme via examples/esp-idf/02_lvgl_demo_v9/sdkconfig.defaults du depot officiel :
; CONFIG_ESPTOOLPY_FLASHMODE_QIO=y, CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y,
; CONFIG_SPIRAM_MODE_OCT=y -> combinaison arduino-esp32 standard "qio_opi".
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
; Sans ceci, "board_build.filesystem" vaut "spiffs" par defaut pour cette
; plateforme -- "pio run -t buildfs"/"uploadfs" construisaient donc une
; image au format SPIFFS (voir le nom de fichier genere,
; ".pio/build/.../spiffs.bin") alors que le firmware monte la partition en
; LittleFS (NvsPersistentStore::NvsPersistentStore(), LittleFS.begin(true)).
; Les deux formats sont incompatibles sur disque : le montage echouait donc
; systematiquement, et le "true" (formatage automatique si le montage
; echoue) effacait aussitot la partition -- data/index.html etc. venaient
; d'etre ecrits avec succes, puis disparaissaient au tout premier demarrage
; qui suivait. Bug reel trouve le 2026-07-24 (portail captif qui affichait
; toujours la page de repli malgre un uploadfs reussi et verifie).
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; C++17 requis par le code partage avec le simulateur (aggregate init sur
; des structs a initialiseurs de membre par defaut, ex: AppError -- echoue
; sous le gnu++11 par defaut de ce framework arduino-esp32, voir erreur
; reelle de compilation corrigee le 2026-07-15).
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I src

; FilePersistentStore.cpp est le backend desktop/simulateur (std::filesystem,
; indisponible sur la toolchain ESP32) -- exclu du firmware, jamais utilise
; en dehors de simulator/CMakeLists.txt (voir docs/ARCHITECTURE.md).
;
; src/theme/, src/widgets/, src/screens/, src/assets/, src/ui/app.cpp,
; ui/ui_model.cpp, ui/trophy_display_ui.cpp, ui/demo_data.cpp et
; ui/RoundUiBridge.cpp (design final + adaptateur, voir
; HANDOFF_PROGRESS.md) sont automatiquement inclus par +<*> ci-dessous,
; aucune regle dediee necessaire.
; main_7inch.cpp/board7inch/* (voir env:waveshare-7inch-rgb ci-dessous)
; incluent esp_display_panel.hpp, absent des lib_deps de cet environnement --
; exclusion symetrique a celle de main_diagnostic.cpp.
build_src_filter =
    +<*>
    -<storage/FilePersistentStore.cpp>
    -<main_diagnostic.cpp>
    -<main_7inch.cpp>
    -<board7inch/*>

; Versions figees sur celles vendorisees par Waveshare dans son depot officiel
; (examples/arduino/libraries/*/library.json), pour garantir la compatibilite
; exacte avec le pilote Arduino_CO5300 et le support tactile CST9217.
; lvgl est ajoute en Phase 3 (necessite un lv_conf.h dedie). Le bring-up
; materiel de la Phase 2 dessine sa mire directement via Arduino_GFX.
; SensorsLib (lewisxhe) ne publie aucun tag Git -- epingle ici sur le commit
; exact resolu et valide par le dernier clean build reussi (2026-07-23,
; RAM 15.3%/Flash 50.6%, 0 warning) plutot que sur la branche par defaut
; (HEAD), pour que le build de demain ne recupere jamais silencieusement une
; revision differente. A re-verifier si le tactile CST9217 cesse de
; fonctionner un jour et qu'une mise a jour delibérée est nécessaire.
; GFX Library for Arduino est vendorisee localement dans lib/Arduino_GFX_Library
; (v1.6.1, licence BSD) plutot que resolue en ligne : voir lib/NOTICE.md pour
; la modification appliquee (retrait du databus RGBPanel incompatible avec
; l'IDF de ce projet, non utilise par notre ecran QSPI de toute facon).
lib_deps =
    https://github.com/lewisxhe/SensorsLib.git#baa3e0b83c256b74d9870a95d96d55595946926c
    https://github.com/lewisxhe/XPowersLib.git#v0.2.6
    bblanchon/ArduinoJson @ 7.4.3
    lvgl/lvgl @ 9.4.0

; Firmware de diagnostic materiel independant (voir DIAGNOSTIC_MATERIEL.bat
; et scripts/diagnostic_materiel.ps1) : mires ecran + test tactile en direct
; + infos puce/memoire, en Arduino_GFX brut (pas de LVGL/AppController/UI
; principale). Reutilise les memes broches (BoardConfig.h, source unique) et les
; memes reglages materiels que l'environnement principal (herites via
; extends), mais un point d'entree totalement separe et EXCLUSIF
; (src/main_diagnostic.cpp) -- ne modifie jamais et ne remplace jamais le
; firmware normal. Reflasher le firmware normal ensuite se fait simplement
; en relancant INSTALLER_ET_LANCER.bat (ou
; "pio run -e waveshare-amoled-175 -t upload").
;
; NOTE (bug reel trouve le 2026-07-23 lors du premier essai materiel) :
; "src_dir" n'est PAS un reglage reconnu au niveau d'un environnement par
; cette version de PlatformIO (6.1.19) -- il est silencieusement ignore
; (voir le warning "Ignore unknown configuration option `src_dir`"), ce qui
; faisait recompiler et reflasher l'INTEGRALITE du firmware normal sous ce
; nom d'environnement, sans jamais toucher a un vrai code de diagnostic.
; Le fichier vit donc dans src/ comme le reste, et build_src_filter exclut
; tout sauf lui (fonctionne car build_src_filter EST un reglage supporte
; par environnement, contrairement a src_dir).
[env:waveshare-amoled-175-diagnostic]
extends = env:waveshare-amoled-175
build_src_filter =
    -<*>
    +<main_diagnostic.cpp>

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-7 (800x480, RGB parallele + tactile GT911 +
; expander CH422G -- architecture totalement differente du board AMOLED
; rond ci-dessus : bus RGB au lieu de QSPI, reset LCD/tactile/retroeclairage
; via IO expander I2C au lieu de GPIO directs). Voir
; include/BoardConfig7inch.h pour les broches documentees (jamais testees
; avant le premier flash reel, materiel recu le 2026-07-28) et
; include/esp_panel_board_custom_conf.h (vendorise tel quel depuis l'exemple
; officiel du fabricant) pour la config reellement utilisee par
; ESP32_Display_Panel.
;
; Le fabricant recommande sa propre librairie ESP32_Display_Panel plutot que
; GFX Library for Arduino (utilisee par le board rond) : c'est elle qui gere
; nativement le bus RGB + l'expander CH422G + le tactile GT911, alors que
; GFX Library for Arduino ne supporte pas cette architecture. Meme
; philosophie que l'environnement rond : reprendre exactement la combinaison
; utilisee par l'exemple officiel (examples/Arduino/examples/10_lvgl_v9_demo
; du depot waveshareteam/ESP32-S3-Touch-LCD-7, vendorise dans
; src/board7inch/esp_lv_adapter_arduino.{h,cpp}) pour maximiser la fiabilite
; de compilation/flash par rapport a une config inventee.
[env:waveshare-7inch-rgb]
; Le pilote RGB d'ESP32_Display_Panel (rgb_ele_order, esp_lcd_types.h) exige
; un ESP-IDF >=5.3, alors que "platform = espressif32" (registry officiel,
; utilise par env:waveshare-amoled-175 ci-dessus) embarque encore IDF 4.4 --
; confirme le 2026-07-28 par une erreur de compilation reelle
; ("'LCD_RGB_ELEMENT_ORDER_RGB' was not declared"). Meme constat et meme
; solution que documentes par ESP32_Display_Panel lui-meme dans son propre
; exemple PlatformIO officiel (examples/platformio/lvgl_v8_port/platformio.ini,
; commentaire "the espressif32 latest official version does not support
; Arduino v3.1.x, temporarily using a third-party version") : bascule sur le
; fork communautaire pioarduino (arduino-esp32 3.1.1, IDF 5.3+), epingle a la
; meme release que cet exemple. N'affecte que cet environnement -- le board
; rond garde son "platform = espressif32" officiel inchange.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Memoire : Flash 16 Mo QIO + PSRAM 8 Mo Octal (ESP32-S3N16R8, meme
; famille de puce que le board rond) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I src

; Meme logique que l'environnement rond : FilePersistentStore.cpp est le
; backend desktop/simulateur (std::filesystem, indisponible sur cette
; toolchain) ; main.cpp/main_diagnostic.cpp appartiennent exclusivement au
; board rond (Arduino_GFX_Library/TouchDrvCST, absents des lib_deps
; ci-dessous). Le framework de pages "App" du design rond (app.cpp,
; trophy_display_ui.cpp, RoundUiBridge.cpp, GestureRecognizer.cpp) et ses
; ecrans (screens/screens.cpp) ne sont jamais utilises par ce board
; (WideUiBridge/screens_wide.cpp le remplacent entierement, voir
; simulator/CMakeLists.txt pour la meme liste de fichiers deja verifiee cote
; simulateur) -- exclus egalement : app.cpp ne compile pas sous lvgl 9.5.0
; (ambiguite std::max(int, lv_coord_t) reelle, trouvee le 2026-07-28 --
; jamais un probleme en production puisque le board rond reste sur lvgl
; 9.4.0).
build_src_filter =
    +<*>
    -<storage/FilePersistentStore.cpp>
    -<main.cpp>
    -<main_diagnostic.cpp>
    -<ui/app.cpp>
    -<ui/trophy_display_ui.cpp>
    -<ui/RoundUiBridge.cpp>
    -<ui/GestureRecognizer.cpp>
    -<ui/demo_data.cpp>
    -<ui/ui_fixtures.cpp>
    -<screens/screens.cpp>
    ; Assets d'essai (voir screens_wide.hpp, fonctions build_*_wide_v2/v3/v4)
    ; -- jamais appeles par WideUiBridge, mais +<*> ci-dessus les compilerait
    ; quand meme (~1.5 Mo a eux deux) si on ne les exclut pas explicitement.
    ; Retirer ces exclusions (et supprimer les fichiers *_v2/v3/v4 ainsi que
    ; ces deux assets) une fois une direction de design retenue.
    -<assets/trophy_ring_full.cpp>
    -<assets/trophy_scene_wide.cpp>

; Versions figees sur des tags Git precis plutot que sur le miroir du
; registry PlatformIO (lzw655/ESP32_Display_Panel, obsolete -- version 1.1.1
; datant de 2023, ne contient ni la classe Board ni le support CH422G/RGB
; utilises ici) : verifie le 2026-07-28 en lisant library.properties/les
; sources directement sur GitHub. ESP32_Display_Panel@v1.0.4 declare
; explicitement depends=ESP32_IO_Expander(>=1.0.0,<2.0.0),
; esp-lib-utils(>=0.2.0,<0.3.0) -- la aussi non satisfaits par le registry
; (esp-lib-utils y est publie en 0.3.0, hors bornes), d'ou l'epinglage manuel
; des trois. lvgl 9.5.0 est la version utilisee par l'exemple officiel
; (esp_lv_adapter_arduino, vendorise ci-dessus) -- environnement separe de
; celui du board rond (lvgl 9.4.0), sans impact dessus.
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    bblanchon/ArduinoJson @ 7.4.3
    lvgl/lvgl @ 9.5.0
